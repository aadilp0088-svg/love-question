<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Question 💕</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    max-width: 90%;
    z-index: 10;
}

h1 {
    color: #ff4d6d;
    margin-bottom: 25px;
}

button {
    padding: 12px 28px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
}

#yesBtn {
    background-color: #ff4d6d;
    color: white;
}

#noBtn {
    background-color: #999;
    color: white;
    position: absolute;
}

.heart {
    position: absolute;
    font-size: 22px;
    animation: fall 4s linear forwards;
    pointer-events: none;
}

@keyframes fall {
    0% { transform: translateY(-10vh); opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0; }
}

.desktop-warning {
    display: none;
    font-size: 20px;
    color: #ff4d6d;
    text-align: center;
}

@media (min-width: 768px) {
    .container { display: none; }
    .desktop-warning { display: block; }
}
</style>
</head>

<body>

<div class="desktop-warning">
📱 Please open this on a mobile phone 💕
</div>

<div class="container" id="box">
<h1>MINNNAAA do you love me? 💖</h1>
<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>
</div>

<audio id="loveSound">
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_9e8b6b45d7.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const box = document.getElementById("box");
const sound = document.getElementById("loveSound");
let heartInterval;

noBtn.addEventListener("touchstart", moveNo);
noBtn.addEventListener("mouseover", moveNo);

function moveNo() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

yesBtn.addEventListener("click", () => {
    sound.play();
    box.innerHTML = "<h1>thankyouuu minnakuttyyy 💖🥰</h1>";
    startHeartRain();
});

function startHeartRain() {
    if (heartInterval) return;
    heartInterval = setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = Math.random() > 0.5 ? "💖" : "💕";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.top = "-20px";
        heart.style.fontSize = (18 + Math.random() * 20) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
    }, 200);
}
</script>

</body>
</html>
